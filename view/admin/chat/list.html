<title>留言管理</title>

<div class="layui-fluid">
  <div class="layui-row layui-col-space15">
    <div class="layui-col-md12">
      <div class="layui-card">
        <div class="layui-card-header">留言板开关</div>
        <div class="layui-card-body" pad15>
          <div class="layui-form" lay-filter="chatset">
            <div class="layui-form-item">
              <label class="layui-form-label">留言板</label>
              <div class="layui-input-block">
                <select name="chat_enable">
                  <option value="1" {:config('web.chat_enable') == '0' ? '' : 'selected'}>开启（首页右下角显示「留言板」按钮）</option>
                  <option value="0" {:config('web.chat_enable') == '0' ? 'selected' : ''}>关闭（首页不再显示，接口也会拒绝留言）</option>
                </select>
              </div>
            </div>
            <div class="layui-form-item">
              <div class="layui-input-block">
                <button class="layui-btn" lay-submit lay-filter="chat_save">保存</button>
                <span style="margin-left: 12px; color: #999; font-size: 12px;">留言存在 gui_chat 表；同一 IP 60 秒 1 条、1 小时最多 20 条；昵称最多 20 字、内容最多 200 字。</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="layui-col-md12">
      <div class="layui-card">
        <div class="layui-card-header">留言列表
          <span class="layuiadmin-badge" style="top: 9px;">
            <input type="text" placeholder="搜昵称或内容" autocomplete="off" class="layui-input layui-input-search" id="chatKeyword" style="width: 160px; background: #f2f2f2; height: 22px;">
            <a class="layui-btn layui-btn-xs" lay-submit lay-filter="chat_search">搜索</a>
            <a class="layui-btn layui-btn-danger layui-btn-xs" id="chatBatchDel" style="margin-left: 6px;">删除选中</a>
          </span>
        </div>
        <div class="layui-card-body">
          <table id="chatTable" lay-filter="chatTable"></table>
          <script type="text/html" id="chatBar">
            <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
          </script>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
layui.use(['table', 'form', 'layer'], function () {
  var $ = layui.$
    , table = layui.table
    , form = layui.form
    , layer = layui.layer;

  table.render({
    elem: '#chatTable',
    url: '/AdminAjax/chat/act/list',
    page: true,
    limit: 15,
    height: 520,
    text: { none: '还没有人留言' },
    cols: [[
      { type: 'checkbox', fixed: 'left' },
      { field: 'id', title: 'ID', width: 80, sort: true },
      { field: 'nickname', title: '昵称', width: 140 },
      { field: 'qq', title: 'QQ', width: 120 },
      { field: 'content', title: '内容', minWidth: 240 },
      { field: 'sendip', title: 'IP', width: 130 },
      { field: 'sendtime', title: '留言时间', width: 170, sort: true },
      { title: '操作', width: 100, fixed: 'right', align: 'center', toolbar: '#chatBar' }
    ]]
  });

  // 搜索
  form.on('submit(chat_search)', function () {
    table.reload('chatTable', {
      where: { keyword: $.trim($('#chatKeyword').val()) },
      page: { curr: 1 }
    });
    return false;
  });

  // 保存开关
  form.on('submit(chat_save)', function (obj) {
    $.post('/AdminAjax/config', obj.field, function (res) {
      layer.msg(res.msg || res.message || '保存成功');
    }, 'json').fail(function () {
      layer.msg('保存失败，请检查登录状态');
    });
    return false;
  });

  // 单条删除
  table.on('tool(chatTable)', function (obj) {
    if (obj.event !== 'del') { return; }
    layer.confirm('确定删除这条留言吗？', { icon: 3, title: '提示' }, function (index) {
      $.post('/AdminAjax/chat/act/del', { id: obj.data.id }, function (res) {
        layer.msg(res.msg || '已处理');
        if (res.code === 0) { obj.del(); }
      }, 'json').fail(function () {
        layer.msg('删除失败，请检查登录状态');
      });
      layer.close(index);
    });
  });

  // 批量删除
  $('#chatBatchDel').on('click', function () {
    var rows = table.checkStatus('chatTable').data;
    if (!rows.length) { layer.msg('请先勾选要删除的留言'); return; }
    layer.confirm('确定删除选中的 ' + rows.length + ' 条留言吗？', { icon: 3, title: '提示' }, function (index) {
      var ids = [];
      for (var i = 0; i < rows.length; i++) { ids.push(rows[i].id); }
      $.post('/AdminAjax/chat/act/del', { ids: ids.join(',') }, function (res) {
        layer.msg(res.msg || '已处理');
        if (res.code === 0) { table.reload('chatTable'); }
      }, 'json').fail(function () {
        layer.msg('删除失败，请检查登录状态');
      });
      layer.close(index);
    });
  });
});
</script>
